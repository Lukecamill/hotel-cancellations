[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-cancellations"
version = "0.1.0"
description = "ARI3217 Task 19 hotel cancellation model and overbooking policy"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=20",
    "scikit-learn>=1.7",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "rdflib>=7.0",
    "pyshacl>=0.30",
    "kagglehub>=0.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary]==3.3.8",
    "prometheus-client==0.26.0",
]

[project.scripts]
hotel-train = "hotel_cancel.train:main"
hotel-serve = "hotel_cancel.service:main"
hotel-batch = "hotel_cancel.batch:main"
hotel-snapshot = "hotel_cancel.snapshot:main"

[project.optional-dependencies]
serving = ["psycopg[binary]==3.3.8"]
dev = ["pytest>=8.0", "ipykernel>=6.0", "nbformat>=5.10", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
hotel_cancel = ["web/*.html"]
