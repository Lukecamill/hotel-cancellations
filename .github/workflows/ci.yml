name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHON: python
      TEST_DATABASE_URL: postgresql://hotel:ci-only-password@127.0.0.1:5432/hotel_test
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/hotel-matplotlib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: make install
      - run: cp env.example .env
      - name: Download and verify frozen source data
        run: make ci-data
      - name: Lowercase registry image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hotel-cancellations" >> "$GITHUB_ENV"
      - name: Run the complete local pipeline
        run: make ci IMAGE="$IMAGE" SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Save the tested image for the separate release job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts/ci/image
          VERSION=$(make version)
          GIT_SHA=$(git rev-parse --short=12 HEAD)
          docker save "$IMAGE:$VERSION" "$IMAGE:$VERSION-$GIT_SHA" -o artifacts/ci/image/service.tar
          sha256sum artifacts/ci/image/service.tar > artifacts/ci/image/service.tar.sha256
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-service-image
          path: artifacts/ci/image/
          retention-days: 1
          if-no-files-found: error
  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PYTHON: python
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/hotel-matplotlib
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: make install
      - run: cp env.example .env
      - run: make ci-data
      - uses: actions/download-artifact@v8
        with:
          name: tested-service-image
          path: artifacts/ci/image/
      - name: Verify and load the exact image built by coursework CI
        run: |
          sha256sum -c artifacts/ci/image/service.tar.sha256
          docker load -i artifacts/ci/image/service.tar
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hotel-cancellations" >> "$GITHUB_ENV"
      - name: Check strict release quality before any registry push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          make publish IMAGE="$IMAGE"
